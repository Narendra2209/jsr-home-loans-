<!DOCTYPE html>

<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#0B133C">
<meta property="og:site_name" content="JSR Home Loan Services">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_IN">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{image}}">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<!-- Marks the document as script-enabled before first paint. The scroll-reveal
     animation is scoped to .js so that if this script never runs - JS disabled,
     blocked, or main.js failing to load - every section stays visible instead of
     the page rendering blank. -->
<script>
document.documentElement.className += " js";
/* Failsafe: if main.js never runs - blocked, cached corrupt, dropped request -
   nothing would ever undo the hidden state, so drop the flag on window load. */
addEventListener("load", function () {
  if (!window.__jsrReady) document.documentElement.classList.remove("js");
});
</script>
{{head_extra}}
</head>
<body data-page="{{page}}" class="{{body_class}}">
<a class="skip-link" href="#main">Skip to main content</a>
